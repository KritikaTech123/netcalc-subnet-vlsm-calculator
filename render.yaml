services:
  - type: web
    name: netcalc-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/health
    plan: free

  - type: web
    name: netcalc-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://netcalc-api.onrender.com/api
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
